<style>
body{margin:0;background:#FFFFFF;color:#2B1A16;font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2B1A16;text-decoration:none}a:hover{color:#E8317A}
*{box-sizing:border-box}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px;position:relative}
.disp{font-family:'Italiana',serif;font-weight:400}
.brush{font-family:'Nanum Brush Script',cursive;color:#E8317A}
.word{font-family:'Allura',cursive}
.chrome{background:conic-gradient(from 210deg,#F3D3C8,#FFFFFF,#E2A99A,#FBEDE8,#CF8C7C,#FFFFFF,#EBC1B4,#F3D3C8)}
.pill{border-radius:999px}
.sp{position:absolute;color:#DDA08F;pointer-events:none;animation:twinkle 3.2s ease-in-out infinite}
.sp.pink{color:#E8317A}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(-2deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes glow{0%,100%{box-shadow:0 0 8px 2px rgba(255,236,214,.9),0 0 22px 6px rgba(255,210,226,.55)}50%{box-shadow:0 0 4px 1px rgba(255,236,214,.6),0 0 12px 3px rgba(255,210,226,.3)}}
.compact{animation:floaty 7s ease-in-out infinite}
.scribble path{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s ease .8s forwards}
.glass{position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(255,255,255,.25) 100%);pointer-events:none}
.pan{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.panbtn:hover .pan,.panbtn:focus-visible .pan{transform:scale(1.08) rotate(-6deg)}
.panbtn .smear{transform:scaleX(.2);opacity:0;transform-origin:left center;transition:transform .5s ease,opacity .3s ease}
.panbtn:hover .smear,.panbtn:focus-visible .smear{transform:scaleX(1);opacity:1}
.look{transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.look:hover{transform:rotate(0deg) translateY(-6px) !important}
.bulb{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFFFFF 0%,#FFF2DE 45%,#F9D3B9 100%);animation:glow 2.8s ease-in-out infinite}
.bulb:nth-child(2n){animation-delay:.7s}.bulb:nth-child(3n){animation-delay:1.4s}
.btn{transition:transform .25s ease,box-shadow .25s ease,background .25s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(232,49,122,.22)}
.heroGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.palette{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:40px 0;align-items:start}
.palMobile{display:none}
.fab{position:fixed;right:22px;bottom:30%;z-index:50;display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 20px 0 16px;border-radius:999px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(232,49,122,.25);box-shadow:0 12px 30px rgba(80,50,40,.18);color:#2B1A16;font-size:15px;font-weight:500;opacity:0;transform:translateY(14px) scale(.96);pointer-events:none;transition:opacity .45s ease,transform .45s ease,background .25s ease}
.fab.on{opacity:.9;transform:none;pointer-events:auto}
.fab.on:hover,.fab.on:focus-visible{opacity:1;background:#FFFFFF;color:#2B1A16}
.fab .ico{width:34px;height:34px;border-radius:50%;background:#E8317A;display:inline-flex;align-items:center;justify-content:center;flex:none}
@media (max-width:560px){.fab{right:14px;padding:0;width:56px;height:56px;min-height:56px;justify-content:center}.fab .lbl{display:none}.fab .ico{width:44px;height:44px}}
.looks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 28px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:center}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.navl{display:flex;gap:30px;align-items:center}
.sig{font-family:'Sacramento',cursive;font-size:30px;color:#2B1A16;opacity:.32;transition:opacity .3s ease}
.sig:hover{opacity:.6;color:#2B1A16}
@media (max-width:1000px){.heroGrid,.two{grid-template-columns:minmax(0,1fr)}.looks{grid-template-columns:repeat(2,minmax(0,1fr))}.palette{grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 0}.tips,.notes{grid-template-columns:minmax(0,1fr)}.navl{display:none}}
@media (max-width:560px){.wrap{padding:0 20px}.palette{display:none !important}.palMobile{display:block}.case{padding:24px 14px !important;border-radius:26px !important}.caseRim{border-radius:36px !important;padding:10px !important}.shadelbl{display:none !important}.panname{font-size:17px !important}.panprice{font-size:13px !important}}
.rail{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%)}
.track{display:flex;gap:28px;width:max-content;padding:24px 14px 34px;animation:slide 70s linear infinite}
.track.rev{animation-name:slideRev;animation-duration:60s;gap:22px}
.rail:hover .track,.rail:focus-within .track{animation-play-state:paused}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes slideRev{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.note{flex:none;width:340px;background:#FFFFFF;border-radius:28px;padding:30px 30px 26px;box-shadow:0 18px 40px rgba(194,31,99,.12);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.note:hover{transform:rotate(0deg) translateY(-6px) !important}
.receipt{flex:none;position:relative;background:#FFFFFF;border-radius:20px;padding:10px;box-shadow:0 14px 30px rgba(194,31,99,.12);transition:transform .35s ease}
.receipt img{display:block;height:132px;width:auto;border-radius:12px}
.tint{position:absolute;inset:10px;border-radius:12px;background:#F4A6BE;opacity:.32;mix-blend-mode:multiply;pointer-events:none;transition:opacity .35s ease}
.receipt:hover .tint{opacity:0}
.receipt:hover{transform:rotate(0deg) scale(1.04) !important}
.bars{display:flex;align-items:center;gap:3px;height:40px;flex:1;min-width:0}
.bar{flex:1;min-width:2px;border-radius:3px;transition:background .2s ease}
.bars.playing .bar{animation:wob 1.1s ease-in-out infinite}
.bars.playing .bar:nth-child(3n){animation-delay:.2s}.bars.playing .bar:nth-child(4n){animation-delay:.45s}.bars.playing .bar:nth-child(5n){animation-delay:.7s}
@keyframes wob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
@media (prefers-reduced-motion:reduce){.track{animation:none}.rail{overflow-x:auto}.bars.playing .bar{animation:none}}
@media (max-width:640px){.note{width:280px;padding:24px}.receipt img{height:104px}.track{animation-duration:55s}}
</style>
</head>
