<!doctype html>
<!-- Designed & developed by Lenyn's Art / The Sharon Effect — 2026 / Built with intention. Every line deliberate. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Confirm bookings — The Sharon Effect</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#E8317A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Italiana&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#FBE3EA;color:#2B1A16;font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#C2185B}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px 64px}
.brand{font-family:'Allura',cursive;font-size:36px;color:#E8317A;text-decoration:none}
h1{font-family:'Italiana',serif;font-weight:400;font-size:38px;margin:18px 0 6px}
.card{background:#FFFFFF;border-radius:24px;padding:22px;margin-top:18px;box-shadow:0 18px 40px rgba(194,31,99,.10)}
.row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px dashed #F3DDD4;font-size:15px}
.row:last-child{border-bottom:0}
.row span:first-child{color:#7A6560}
.row span:last-child{text-align:right;font-weight:500}
.big{font-family:'Italiana',serif;font-size:40px;line-height:1}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;border:0;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
.go{background:#E8317A;color:#FFFFFF;width:100%;font-size:17px;min-height:60px}
.no{background:#FFFFFF;color:#2B1A16;border:1px solid #EBC9BD;width:100%;margin-top:10px}
.ghost{background:transparent;color:#7A6560;min-height:44px;padding:0 8px;font-weight:500;text-decoration:underline}
label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7A6560;margin:14px 0 8px}
input{width:100%;font:inherit;font-size:16px;padding:14px 16px;border:1px solid #EBC9BD;border-radius:16px;background:#FFFFFF;color:#2B1A16;min-height:50px}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid #E8317A;outline-offset:2px}
.badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.st-pending{background:#FFF3D6;color:#7A4B00}.st-confirmed{background:#DDF3E4;color:#1D6B3A}.st-declined,.st-cancelled,.st-expired{background:#F6EEF0;color:#7A6560}
.err{background:#FCE6EC;color:#9E1249;border-radius:16px;padding:12px 16px;font-size:14px;margin-top:14px}
.list a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid #F3DDD4;color:#2B1A16;text-decoration:none}
.list a:last-child{border-bottom:0}
.muted{color:#7A6560;font-size:14px}
.tabs{display:flex;gap:8px;margin-top:16px}
.tabs button{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:#FFFFFF;color:#2B1A16;font:inherit;font-size:14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:#2B1A16;color:#FFFFFF}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-head span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7A6560;text-align:center;padding-bottom:6px;display:block}
.cal-cell{position:relative;aspect-ratio:1;border:0;background:#FBF4F1;border-radius:10px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.cal-cell.cal-empty{background:transparent;cursor:default}
.cal-num{font-size:13px;color:#2B1A16}
.cal-cell.cal-today .cal-num{font-weight:700;color:#E8317A}
.cal-cell.cal-sel{outline:2px solid #E8317A;outline-offset:-2px}
.cal-dots{display:flex;gap:2px}
.cal-dot{width:5px;height:5px;border-radius:50%;background:#C9B8B0}
.cal-dot.st-pending{background:#D9A300}
.cal-dot.st-confirmed{background:#1D6B3A}
.cal-dot.st-declined,.cal-dot.st-cancelled,.cal-dot.st-expired{background:#B8A49C}
.cal-more{font-size:9px;color:#7A6560}
</style>
</head>
<body>
<div class="wrap">
<a class="brand" href="index.html">The Sharon Effect</a>
<div id="view"><p class="muted" style="margin-top:24px">Loading…</p></div>
</div>
<script>
(function () {
  var cfg = window.TSE_CONFIG || {};
  var sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  var view = document.getElementById('view');
  var params = new URLSearchParams(location.search);
  var bookingId = params.get('b');
  var listFilter = 'pending';
  var calDate = new Date();
  var calSelected = null;

  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function naira(n) { return '₦' + Number(n || 0).toLocaleString('en-NG'); }
  function fmtDate(d) { var x = new Date(d + 'T00:00:00'); return x.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }
  function waNumber(p) { var d = String(p || '').replace(/\D/g, ''); if (d.indexOf('0') === 0) d = '234' + d.slice(1); return d; }

  function showLogin(msg) {
    view.innerHTML =
      '<h1>Sharon’s bookings</h1><p class="muted">Log in once on this phone and you’ll stay logged in.</p>' +
      '<form class="card" id="login"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required>' +
      '<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>' +
      '<button class="pill go" style="margin-top:18px" type="submit">Log in</button>' +
      (msg ? '<div class="err" role="alert">' + esc(msg) + '</div>' : '') + '</form>';
    document.getElementById('login').onsubmit = async function (e) {
      e.preventDefault();
      var r = await sb.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value });
      if (r.error) return showLogin('That email or password didn’t work.');
      route();
    };
  }

  function notStaff() {
    view.innerHTML = '<h1>Not allowed</h1><div class="card"><p>Only The Sharon Effect can confirm bookings.</p><button class="pill ghost" id="out">Log out</button></div>';
    document.getElementById('out').onclick = async function () { await sb.auth.signOut(); route(); };
  }

  async function showBooking(id, flash) {
    var r = await sb.from('bookings').select('*').eq('id', id).maybeSingle();
    if (r.error || !r.data) {
      view.innerHTML = '<h1>Booking not found</h1><div class="card"><p class="muted">This link may be wrong, or the booking was removed.</p><a class="pill no" href="confirm.html">See all bookings</a></div>';
      return;
    }
    var b = r.data;
    var from = b.price_is_from ? 'from ' : '';
    var waClient = 'https://wa.me/' + waNumber(b.client_phone) + '?text=' + encodeURIComponent(
      b.status === 'confirmed'
        ? 'Hi ' + b.client_name + ' ♡ your booking ' + b.ref + ' is confirmed for ' + fmtDate(b.booking_date) + ', ' + b.booking_time + '. Can’t wait to see you! — Sharon'
        : 'Hi ' + b.client_name + ', this is Sharon from The Sharon Effect about booking ' + b.ref + '.');
    var actions = b.status === 'pending'
      ? '<p class="muted" style="margin:0 0 12px">Check your OPay app for <b>' + naira(b.deposit) + '</b> with note <b>' + esc(b.ref) + '</b>, then:</p>' +
        '<button class="pill go" id="yes">Payment received ✓</button><button class="pill no" id="nope">Not received</button>'
      : '<p style="margin:0 0 12px">This booking is <span class="badge st-' + b.status + '">' + b.status + '</span></p>' +
        (b.status !== 'confirmed' ? '<button class="pill no" id="reopen">Move back to pending</button>' : '');
    view.innerHTML =
      (flash ? '<div class="err" style="background:#DDF3E4;color:#1D6B3A">' + esc(flash) + '</div>' : '') +
      '<h1>' + esc(b.ref) + '</h1><span class="badge st-' + b.status + '">' + b.status + '</span>' +
      '<div class="card"><div class="muted">Deposit to check</div><div class="big">' + naira(b.deposit) + '</div><div class="muted" style="margin-top:6px">Total ' + from + naira(b.total) + '</div></div>' +
      '<div class="card">' + actions + '</div>' +
      '<div class="card">' +
      '<div class="row"><span>Client</span><span>' + esc(b.client_name) + '</span></div>' +
      '<div class="row"><span>WhatsApp</span><span><a href="' + waClient + '" target="_blank" rel="noopener">' + esc(b.client_phone) + '</a></span></div>' +
      (b.client_email ? '<div class="row"><span>Email</span><span>' + esc(b.client_email) + '</span></div>' : '') +
      '<div class="row"><span>Service</span><span>' + esc(b.service_name) + (b.faces > 1 ? ' × ' + b.faces : '') + '</span></div>' +
      '<div class="row"><span>When</span><span>' + fmtDate(b.booking_date) + ', ' + esc(b.booking_time) + '</span></div>' +
      '<div class="row"><span>Where</span><span>' + esc(b.location_name) + '</span></div>' +
      (b.address ? '<div class="row"><span>Address</span><span>' + esc(b.address) + '</span></div>' : '') +
      (b.event ? '<div class="row"><span>Event</span><span>' + esc(b.event) + '</span></div>' : '') +
      (b.allergies ? '<div class="row"><span>Allergies</span><span>' + esc(b.allergies) + '</span></div>' : '') +
      '<div class="row"><span>Photo consent</span><span>' + (b.photo_ok ? 'Yes' : 'No') + '</span></div>' +
      '<div class="row"><span>Booked</span><span>' + new Date(b.created_at).toLocaleString('en-GB') + '</span></div>' +
      '</div>' +
      '<a class="pill no" style="margin-top:18px" href="' + waClient + '" target="_blank" rel="noopener">Message ' + esc(b.client_name.split(' ')[0]) + ' on WhatsApp</a>' +
      '<p style="text-align:center;margin-top:12px"><a href="confirm.html">All bookings</a></p>';
    async function setStatus(st, msg) {
      var res = await sb.rpc('set_booking_status', { p_id: b.id, p_status: st });
      if (res.error) { alertBox(res.error.message); return; }
      showBooking(b.id, msg);
    }
    var y = document.getElementById('yes'); if (y) y.onclick = function () { y.disabled = true; y.textContent = 'Confirming…'; setStatus('confirmed', 'Confirmed. The client’s page has updated. Send them a quick message below ♡'); };
    var n = document.getElementById('nope'); if (n) n.onclick = function () { if (confirm('Mark this payment as not received?')) setStatus('declined', 'Marked as not received.'); };
    var ro = document.getElementById('reopen'); if (ro) ro.onclick = function () { setStatus('pending', 'Moved back to pending.'); };
  }

  function alertBox(msg) { var d = document.createElement('div'); d.className = 'err'; d.setAttribute('role', 'alert'); d.textContent = msg; view.prepend(d); }

  function tabsHtml(active) {
    var tabs = [['pending', 'To confirm'], ['upcoming', 'Upcoming'], ['all', 'All'], ['calendar', 'Calendar']];
    return '<div class="tabs" role="group" aria-label="Filter bookings">' + tabs.map(function (t) {
      return '<button aria-pressed="' + (active === t[0]) + '" data-f="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>';
  }

  function wireTabs() {
    view.querySelectorAll('[data-f]').forEach(function (btn) {
      btn.onclick = function () {
        var f = btn.getAttribute('data-f');
        if (f === 'calendar') showCalendar(); else { listFilter = f; showList(); }
      };
    });
    var out = document.getElementById('out');
    if (out) out.onclick = async function () { await sb.auth.signOut(); route(); };
  }

  async function showList() {
    var q = sb.from('bookings').select('id,ref,status,client_name,service_name,booking_date,booking_time,deposit').order('booking_date', { ascending: true }).limit(100);
    if (listFilter === 'pending') q = q.eq('status', 'pending');
    else if (listFilter === 'upcoming') q = q.eq('status', 'confirmed').gte('booking_date', new Date().toISOString().slice(0, 10));
    var r = await q;
    var rows = (r.data || []).map(function (b) {
      return '<a href="confirm.html?b=' + b.id + '"><span><b>' + esc(b.client_name) + '</b><br><span class="muted">' + esc(b.service_name) + ' · ' + fmtDate(b.booking_date) + ', ' + esc(b.booking_time) + '</span></span>' +
        '<span style="text-align:right"><span class="badge st-' + b.status + '">' + b.status + '</span><br><span class="muted">' + naira(b.deposit) + '</span></span></a>';
    }).join('');
    view.innerHTML = '<h1>Bookings</h1>' + tabsHtml(listFilter) +
      '<div class="card list">' + (rows || '<p class="muted" style="margin:0">Nothing here right now.</p>') + '</div>' +
      '<p style="text-align:center;margin-top:18px"><button class="pill ghost" id="out">Log out</button></p>';
    wireTabs();
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  async function showCalendar() {
    var y = calDate.getFullYear(), m = calDate.getMonth();
    var first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
    var firstIso = y + '-' + pad2(m + 1) + '-01';
    var lastIso = y + '-' + pad2(m + 1) + '-' + pad2(last.getDate());
    var r = await sb.from('bookings').select('id,ref,status,client_name,service_name,booking_date,booking_time,deposit')
      .gte('booking_date', firstIso).lte('booking_date', lastIso).neq('status', 'expired').order('booking_time', { ascending: true });
    var byDate = {};
    (r.data || []).forEach(function (b) { (byDate[b.booking_date] = byDate[b.booking_date] || []).push(b); });
    var todayIso = new Date().toISOString().slice(0, 10);
    var cells = '';
    for (var i = 0; i < first.getDay(); i++) cells += '<div class="cal-cell cal-empty"></div>';
    for (var d = 1; d <= last.getDate(); d++) {
      var iso = y + '-' + pad2(m + 1) + '-' + pad2(d);
      var items = byDate[iso] || [];
      var dots = items.slice(0, 3).map(function (b) { return '<span class="cal-dot st-' + b.status + '"></span>'; }).join('');
      cells += '<button type="button" class="cal-cell' + (iso === todayIso ? ' cal-today' : '') + (iso === calSelected ? ' cal-sel' : '') + '" data-d="' + iso + '">' +
        '<span class="cal-num">' + d + '</span>' +
        (items.length ? '<span class="cal-dots">' + dots + (items.length > 3 ? '<span class="cal-more">+' + (items.length - 3) + '</span>' : '') + '</span>' : '') +
        '</button>';
    }
    var monthLabel = first.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    var dayItems = calSelected ? (byDate[calSelected] || []) : [];
    var dayList = !calSelected ? '' : '<div class="card list" style="margin-top:14px"><div class="muted" style="padding:4px 4px 10px">' + fmtDate(calSelected) + '</div>' +
      (dayItems.length ? dayItems.map(function (b) {
        return '<a href="confirm.html?b=' + b.id + '"><span><b>' + esc(b.client_name) + '</b><br><span class="muted">' + esc(b.service_name) + ' · ' + esc(b.booking_time) + '</span></span>' +
          '<span style="text-align:right"><span class="badge st-' + b.status + '">' + b.status + '</span><br><span class="muted">' + naira(b.deposit) + '</span></span></a>';
      }).join('') : '<p class="muted" style="margin:0">Nothing booked this day.</p>') + '</div>';
    view.innerHTML = '<h1>Bookings</h1>' + tabsHtml('calendar') +
      '<div class="card" style="padding:16px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">' +
      '<button type="button" class="pill ghost" id="calPrev" aria-label="Previous month" style="padding:0 10px">‹</button>' +
      '<b>' + monthLabel + '</b>' +
      '<button type="button" class="pill ghost" id="calNext" aria-label="Next month" style="padding:0 10px">›</button>' +
      '</div>' +
      '<div class="cal-grid cal-head"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '</div>' + dayList +
      '<p style="text-align:center;margin-top:18px"><button class="pill ghost" id="out">Log out</button></p>';
    wireTabs();
    document.getElementById('calPrev').onclick = function () { calDate = new Date(y, m - 1, 1); calSelected = null; showCalendar(); };
    document.getElementById('calNext').onclick = function () { calDate = new Date(y, m + 1, 1); calSelected = null; showCalendar(); };
    view.querySelectorAll('[data-d]').forEach(function (btn) {
      btn.onclick = function () { var d = btn.getAttribute('data-d'); calSelected = calSelected === d ? null : d; showCalendar(); };
    });
  }

  async function route() {
    var s = await sb.auth.getSession();
    if (!s.data.session) return showLogin();
    var staff = await sb.rpc('is_staff');
    if (!staff.data) return notStaff();
    if (bookingId) showBooking(bookingId); else showList();
  }
  route();
})();
</script>
</body>
</html>
